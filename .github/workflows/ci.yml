name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      # The lockfile is written by npm 11; npm 10 (bundled with Node 22) resolves it differently.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - name: Lint, typecheck, build, test
        run: npx nx run-many -t lint typecheck build test
      - name: WordPress plugin (php -l + zip)
        run: npx nx run-many -t lint package -p wordpress
      - uses: actions/upload-artifact@v4
        with:
          name: wordpress-plugin
          path: artifacts/wordpress/*.zip
          if-no-files-found: error
